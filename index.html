<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario-Proyecto7</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <section>

            <h1 id="titulo-formulario" class="titulo-oculto">
                Formulario
            </h1>

            <div class="campo">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="¿Cómo te llamas?" autocomplete="name"
                    required>

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" autocomplete="email" aria-invalid="true" aria-describedby="error-correo" required>

                <p class="error" id="error-correo" role="alert">Correo o contraseña incorrectos </p>


                <label for="password">Ingresa tu contraseña</label>
                <input type="password" id="password" name="password" placeholder="Escribe tu contraseña"
                    autocomplete="new-password" required>

                <label for="confirmar">Confirma tu contraseña</label>
                <input type="password" id="confirmar" name="confirmar" placeholder="Repite tu contraseña"
                    autocomplete="new-password" required>

            </div>


            <button type="submit" class="boton-actualizar">
                Actualizar perfil
            </button>

            </form>
        </section>

        <aside class="panel-progreso" aria-label="Estado del perfil">

            <div class="circulo-progreso" role="progressbar" aria-label="Perfil completado" aria-valuemin="0"
                aria-valuemax="100" aria-valuenow="50">
                <span>50%</span>
            </div>

            <h2>Perfil completado</h2>

            <ul class="lista-requisitos">

                <li><del>Crear cuenta</del> </li>
                <li><del>Actualizar progreso de aprendizaje</del></li>
                <li><del> perfil público </del></li>
                <li>Completar tu primer proyecto</li>
                <li>Invitar a tus amigos</li>

            </ul>

        </aside>

    </main>

</body>

</html>
